# =============================================
# Guacamole Properties Configuration
# MySQL JDBC authentication for Lab-as-a-Service
# =============================================

# guacd connection
guacd-hostname=guacd
guacd-port=4822

# Clipboard
enable-clipboard-integration=true

# =============================================
# MySQL JDBC Authentication
# =============================================
# The orchestration-service creates connection records directly in MySQL.
# Guacamole reads from the same database to find available connections.
mysql-hostname=guac-mysql
mysql-port=3306
mysql-database=guacamole_db
mysql-username=guacuser
mysql-password=guacpass

# Auto-create accounts (disabled — we provision users via SQL script)
mysql-auto-create-accounts=false

# Allow concurrent use of the same connection by multiple users
mysql-default-max-connections=0
mysql-default-max-connections-per-user=0

# =============================================
# Session & Connection Stability
# =============================================
# Extend API session (auth token) timeout to 8 hours (480 min).
# Default is 60 min. Long image-build sessions need this.
api-session-timeout=480

# Ensure WebSocket tunnel is enabled (default, but explicit is safer).
# Without WebSocket, Guacamole falls back to HTTP long-polling which is
# much less stable for iframe-embedded terminals.
enable-websocket=true

# =============================================
# Connection Keepalive
# =============================================
# Send a NOP keepalive instruction to the browser every 30 seconds over the
# WebSocket tunnel. This prevents NAT devices (typically 47-60 s TCP idle
# timeout) from dropping the WebSocket connection during periods when the
# terminal has no visible output (e.g. waiting for apt-get to finish).
# Requires Guacamole 1.4.0+.
connection-keep-alive=30000

# =============================================
# Nginx Configuration Snippet for Lab-as-a-Service
# =============================================
# Add these location blocks to your existing nginx server block
# on server 192.168.2.250.
#
# Current setup:
#   - Web portal (Next.js): localhost:4200
#   - Orchestration service: localhost:3004
#   - Guacamole: localhost:8080
#   - External access: http://221.132.18.35:7300/ (NAT)
# =============================================

# Required for WebSocket upgrade (Guacamole uses WebSocket)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # ---- ttyd terminal proxy for custom image builder ----
    # Browser loads iframe at /ttyd-proxy/{sessionId}/ and connects WebSocket
    # to /ttyd-proxy/{sessionId}/ws. Both proxy directly to the lab-service (port 3003)
    # which relays traffic to ttyd on the VM (192.168.2.x:7681).
    # Must appear before the catch-all location / so nginx matches it first.
    location /ttyd-proxy/ {
        proxy_pass http://127.0.0.1:3003/api/v1/ttyd-proxy/;
        proxy_http_version 1.1;

        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time terminal data
        proxy_buffering off;

        # Long timeouts for interactive SSH sessions
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
    }

    # ---- Next.js Web Portal (existing) ----
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        # Use $http_host (includes port) so Next.js Server Actions host check passes.
        # $host strips the port; $http_host preserves it (e.g. 221.132.18.35:7300).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Guacamole Web UI (NEW) ----
    # Proxies browser access to Guacamole for SSH terminal sessions.
    # WebSocket support is REQUIRED for Guacamole's tunnel protocol.
    location /guacamole/ {
        proxy_pass http://127.0.0.1:8080/guacamole/;
        proxy_http_version 1.1;

        # WebSocket support (critical for Guacamole)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        # Use $http_host (includes port) — must match the Origin header the
        # browser sends, otherwise Tomcat may reject the WebSocket upgrade.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip Origin header to prevent Tomcat/Guacamole from rejecting
        # WebSocket upgrades when the page is embedded in an iframe.
        proxy_set_header Origin "";

        # =============================================
        # IFRAME EMBEDDING FIX (ROOT CAUSE OF DISCONNECT)
        # =============================================
        # Guacamole's Tomcat sends these security headers by default:
        #   X-Frame-Options: DENY
        #   Content-Security-Policy: frame-ancestors 'none'
        # These headers tell the browser to BLOCK the page inside an iframe.
        # The browser blocks WebSocket tunnel creation → SSH disconnects instantly.
        # We must strip them and add permissive replacements.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://221.132.18.35:7300 http://221.132.18.35;" always;

        # Disable buffering for real-time terminal
        proxy_buffering off;

        # Timeouts for long SSH sessions
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Enable TCP keepalive on the Nginx → Tomcat socket.
        # Without this, NAT devices between Nginx and Tomcat can drop idle TCP
        # connections before the WebSocket tunnel is used, causing ~47s disconnects.
        proxy_socket_keepalive on;
    }
}
